<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solo Business × AI Agent — System Map</title>
<style>
:root{--foreground:#1f2328;--muted-foreground:#59636e;--border:#d1d9e0;--card:#ffffff;--accent:#eef1f4;--bg:#f6f8fa}
@media (prefers-color-scheme:dark){:root{--foreground:#e6edf3;--muted-foreground:#9198a1;--border:#3d444d;--card:#151b23;--accent:#262c36;--bg:#0d1117}}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--bg);color:var(--foreground);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:1180px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
h1{font-size:19px;margin:0}
h2{font-size:16px;margin:0 0 4px}
.sub{color:var(--muted-foreground);font-size:12px;margin-bottom:14px}
.lang{white-space:nowrap}
.lang button{padding:4px 10px;border:1px solid var(--border);background:transparent;color:var(--muted-foreground);border-radius:6px;cursor:pointer;font:inherit;font-size:12px}
.lang button.on{background:var(--accent);color:var(--foreground)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px;border-bottom:1px solid var(--border);padding-bottom:10px}
.tab{padding:6px 12px;border:1px solid var(--border);border-radius:7px;cursor:pointer;background:transparent;color:var(--muted-foreground);font:inherit;font-size:12.5px}
.tab:hover{color:var(--foreground)}
.tab.on{background:var(--accent);color:var(--foreground)}
.view{display:none}.view.on{display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px;font-size:11.5px;color:var(--muted-foreground);align-items:center}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.scroll{overflow-x:auto}
.grid{min-width:980px}
.lanehead,.lane{display:grid;grid-template-columns:112px repeat(5,1fr);gap:7px;margin-bottom:8px}
.lane{align-items:stretch}
.stagehd{padding:7px 9px;border-radius:7px;font-weight:600;font-size:12.5px;text-align:center;border:1px solid var(--border)}
.s1{background:rgba(96,165,250,.16)}.s2{background:rgba(52,211,153,.16)}.s3{background:rgba(251,191,36,.16)}.s4{background:rgba(251,113,133,.16)}.s5{background:rgba(167,139,250,.16)}
.lanelbl{font-size:11.5px;color:var(--muted-foreground);display:flex;align-items:center;padding:6px;border-right:2px solid var(--border);font-weight:600;line-height:1.35}
.cell{display:flex;flex-direction:column;gap:5px;padding:7px;border:1px dashed var(--border);border-radius:8px;min-height:44px}
.n{padding:5px 8px;border-radius:6px;border:1px solid var(--border);cursor:pointer;font-size:11.5px;background:var(--card);transition:.12s}
.n:hover{border-color:var(--foreground)}
.n.sel,.step.sel{outline:2px solid var(--foreground);outline-offset:1px}
.n .t{font-weight:600}.n .m{color:var(--muted-foreground);font-size:10.5px;margin-top:1px}
.n.skill{border-left:3px solid #60a5fa}.n.obs{border-left:3px solid #34d399}.n.data{border-left:3px solid #fbbf24}.n.notion{border-left:3px solid #f472b6}.n.act{border-left:3px solid var(--muted-foreground)}
.sot{font-size:9.5px;padding:1px 4px;border-radius:3px;background:rgba(52,211,153,.22);margin-left:4px;white-space:nowrap;font-style:normal}
.step{flex:1;display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--card);cursor:pointer;transition:.12s}
.step:hover{border-color:var(--foreground)}
.num{min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex-shrink:0;margin-top:1px}
.step .t{font-weight:600;font-size:12.5px}.step .m{color:var(--muted-foreground);font-size:11px;margin-top:2px}
.step.gate{border-color:#ef4444;background:rgba(239,68,68,.06)}.step.gate .num{background:rgba(239,68,68,.3)}
.step.gap{border-style:dashed;border-color:#ef4444}
.arrow{height:15px;display:flex;align-items:center;padding-left:9px;color:var(--muted-foreground);font-size:12px}
.par{display:flex;gap:9px;flex-wrap:wrap}.par .step{flex:1;min-width:220px}
.branch{margin-left:26px;border-left:2px dashed var(--border);padding-left:12px}
.detail{position:sticky;bottom:0;margin-top:16px;border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--card);box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.detail .dt{font-weight:700;font-size:13.5px;margin-bottom:2px}.detail .dd{color:var(--muted-foreground);font-size:11.5px;margin-bottom:9px}
.io{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.iobox{border:1px solid var(--border);border-radius:7px;padding:8px 10px}
.iobox .h{font-size:10.5px;color:var(--muted-foreground);font-weight:700;margin-bottom:4px}
.iobox ul{margin:0;padding-left:15px}.iobox li{margin-bottom:2px;font-size:11.5px}
.warn{margin-top:9px;padding:7px 10px;border-radius:7px;background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.3);font-size:11.5px}
.note{margin-top:9px;padding:7px 10px;border-radius:7px;background:var(--accent);border:1px solid var(--border);font-size:11.5px}
.hint{color:var(--muted-foreground);font-size:11px;font-style:italic}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid var(--border);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--accent);font-size:11.5px}td.f{font-weight:600}
.tag{padding:1px 5px;border-radius:4px;font-size:10.5px;white-space:nowrap}
.tS{background:rgba(96,165,250,.18)}.tO{background:rgba(52,211,153,.18)}.tD{background:rgba(251,191,36,.18)}.tN{background:rgba(244,114,182,.18)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 id="title"></h1>
      <div class="sub" id="subtitle" style="margin:4px 0 0"></div>
    </div>
    <div class="lang"><button data-l="0" class="on">EN</button> <button data-l="1">日本語</button></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="views"></div>
  <div class="detail" id="detail"></div>
</div>
<script>
/* All business-specific details (prices, sales tactics, client data, case IDs) are intentionally omitted.

let L=0;
const T=x=>Array.isArray(x)?x[L]:(x||'');
const D={};
function N(id,cls,t,m,d){D[id]=Object.assign({t,m},d||{});return ()=>`<div class="n ${cls}" data-id="${id}"><div class="t">${T(t)}</div>${T(m)?`<div class="m">${T(m)}</div>`:''}</div>`}
function S(id,n,cls,t,m,d){D[id]=Object.assign({t,m},d||{});return ()=>`<div class="step ${cls||''}" data-id="${id}"><div class="num">${n}</div><div><div class="t">${T(t)}</div>${T(m)?`<div class="m">${T(m)}</div>`:''}</div></div>`}
const SOT=x=>[`<i class="sot">${x[0]}</i>`,`<i class="sot">${x[1]}</i>`];
const SOTt=['single source','唯一の正'];
const tt=(a,b)=>[a,b];
const AR=()=>'<div class="arrow">↓</div>';
const PAR=(...xs)=>()=>`<div class="par">${xs.map(f=>f()).join('')}</div>`;

 tabs:[['main',['Overview (swimlanes)','全体（スイムレーン）']],['s1',['① Content','① 発信']],['s2',['② Pre-sales','② 商談前']],['s3',['③ Delivery','③ 提供']],['s4',['④ After-sales','④ アフター対応']],['s5',['⑤ Analytics','⑤ 分析']],['sot',['Single-source table','唯一の正 一覧']]],

 s3:[['Payment → create client record → fork by product type. Delivery forms differ completely, so only the custom-report product needs an agent skill.','入金 → 顧客記録を作成 → 商品タイプで分岐。提供形態がまったく違うため、エージェントskillが必要なのはカスタムレポート商品のみ。']],

 s5:[['Fetch (read-only) → verify tags → three hard sample gates → grade findings → human-approved write-back. One solid finding beats several built on weak samples.','取得（読取専用）→ タグ確認 → 3つのサンプル基準 → 結論の格付け → 人間の承認後に書き戻し。弱いサンプルで数を揃えるより、確かな結論1つ。']]

const lanes=[
 [['Owner (human)','オーナー（人間）'],[
  [N('a1','act',['Pick topic / finalize draft','テーマ決定／原稿確定'],['Final wording is always the owner\'s','最終的な言葉は常にオーナーが決める'],{w:[['Owner\'s edits → learning evidence','オーナーの修正 → 学習の証拠']]}),N('a1b','act',['Publish','公開'],'')],
  [N('a2','act',['Receive DM / comment','DM・コメントを受信'],''),N('a2b','act',['Edit reply draft, then send','返信案を修正して送信'],['Agent draft vs. sent version = training signal','エージェント案と実送信の差分＝学習材料']),N('a2c','act',['Weekly follow-up list (Mon 09:00)','毎週月曜のフォロー一覧'],['Reminder only — never sends on the owner\'s behalf','通知のみ。代理送信はしない'],{n:['Scheduled job, because the agent has no persistent process and cannot "remember" to follow up on its own. Silent when there is nothing to do.','エージェントは常駐しておらず自分から「思い出す」ことができないため、定期ジョブで実行。対象がなければ通知しない。']})],
  [N('a3','act',['Upload session notes','面談メモをアップロード'],['Custom-report product only','カスタムレポート商品のみ']),N('a3b','act',['Review report → approve → deliver','レポート確認 → 承認 → 納品'],'')],
  [N('a3c','act',['Forward client questions (screenshots)','顧客の質問をスクショで共有'],['Q&A / repurchase / benefit questions','質問／再購入／特典の問い合わせ']),N('a3d','act',['Edit reply draft, then send','返信案を修正して送信'],'')],
  [N('a4','act',['Decide review batch & criteria','振り返り対象と基準を決める'],['Monthly, or when enough data accumulates','月次、またはデータが溜まった時'])]
 ]],
 [['Agent skills','エージェントskill'],[
  [N('k-cw','skill',['content-writing','content-writing'],['Dedupe · register · draft · title · learn from edits','重複確認・登録・執筆・タイトル・修正からの学習'],{r:[['topic-library (single entry point)','topic-library（唯一の入口）'],['audience profiles / title library / style examples','読者像／タイトル集／文体サンプル'],['learned patterns / anti-patterns','学習済みパターン／アンチパターン'],['brand positioning (Obsidian)','ブランドポジショニング（Obsidian）']],w:[['topic-library entry','topic-library への登録'],['content-ledger row','content-ledger の行']],g:['Writing back learned patterns requires approval','学習パターンの書き戻しは承認が必要']}),
   N('k-pd','skill',['persuasion-diagnosis','persuasion-diagnosis'],['Optional: diagnose why a piece persuades','任意：説得力の構造を診断']),

  [N('k-cc','skill',['client-communication','client-communication'],['Stage judgment · product fit · reply drafting','段階判断・商品適合・返信案作成'],{r:[['product-matrix (single source for product facts)','product-matrix（商品事実の唯一の正）'],['decision framework / case library / failure patterns','判断フレーム／事例集／失敗パターン'],['client-registry rules → Notion client records','client-registry のルール → Notion顧客記録'],['ICP / persona / pre-sales SOP (Obsidian)','ICP／ペルソナ／商談前SOP（Obsidian）']],w:[['topic signals → topic-library','テーマ候補 → topic-library'],['market insights / learned patterns','市場インサイト／学習パターン']],g:['Channel compliance gate; write-backs require approval','チャネル規約ゲート；書き戻しは承認が必要']})],
  [N('k-rw','skill',['report-writing','report-writing'],['Only the custom-report product needs a skill','カスタムレポート商品のみskillが必要'],{r:[['intake survey (Google Sheets)','事前アンケート（Google Sheets）'],['session notes uploaded by owner','オーナーがアップした面談メモ'],['sample reports','サンプルレポート']],w:[['Notion delivery page','Notion納品ページ']],g:['Explicit approval required before writing to Notion','Notionへの書き込み前に明示的な承認が必要']}),

  [N('k-ps','skill',['post-sale-support','post-sale-support'],['Shared by all products: Q&A · benefits · repurchase · close-out','全商品共通：質問対応・特典・再購入・クローズ'],{r:[['Notion client record (identity + communication constraints)','Notion顧客記録（本人特定＋コミュニケーション上の制約）'],['product-matrix: scope per product','product-matrix：商品ごとの範囲'],['reply templates (owner\'s real phrasing)','返信テンプレート（オーナーの実際の言い回し）']],w:[['Notion client timeline','Notion顧客タイムライン'],['Notion consultation log','Notion相談ログ'],['case library (approval needed)','事例集（承認が必要）']],g:['Four rules: when declining, still point the way / satisfaction ≠ need for an upgrade / no ad-hoc side deals / verify delivery assets every time','4原則：断る時も道を示す／満足≠上位商品が必要／場当たり的な特別対応をしない／納品物は毎回確認']})],
  [N('k-bdc','skill',['business-data-connections','business-data-connections'],['Data access layer (read-only)','データ取得層（読取専用）'],{r:[['Feishu Base reader (fields | sample | extract)','Feishu Base リーダー（fields｜sample｜extract）'],['Google Sheets reader (service account)','Google Sheets リーダー（サービスアカウント）']],w:[['Writes to no data source','どのデータソースにも書かない']],g:['Read-only; no cross-source identity matching at this layer','読取専用；この層ではソース間の本人照合をしない']}),
   N('k-cpr','skill',['content-performance-review','content-performance-review'],['Tag · compute · validate · write back','タグ付け・計算・検証・書き戻し'],{r:[['Feishu: post metrics / full text / conversion attribution','Feishu：投稿指標／本文／成約の帰属'],['content-ledger index','content-ledger の索引']],w:[['what-works / what-fails (Obsidian)','what-works／what-fails（Obsidian）'],['content-writing learned patterns','content-writing の学習パターン']],g:['Write-backs to Obsidian and skills require approval','Obsidianとskillへの書き戻しは承認が必要']})]
 ]],
 [['Rule & memory files','ルール・記憶ファイル'],[
  [N('f-tl','skill',[`topic-library ${SOT(SOTt)[0]}`,`topic-library ${SOT(SOTt)[1]}`],['Topics to write — single entry point','未執筆テーマ — 唯一の入口']),N('f-cl','skill',['content-ledger','content-ledger'],['Draft ↔ topic ↔ post-ID index only','原稿↔テーマ↔投稿IDの索引のみ']),N('f-lp','skill',['learned patterns / anti-patterns','学習パターン／アンチパターン'],['Learned from the owner\'s edits','オーナーの修正から学習'])],
  [N('f-pm','skill',[`product-matrix ${SOT(SOTt)[0]}`,`product-matrix ${SOT(SOTt)[1]}`],['Product facts; re-verified every 30 days','商品事実；30日ごとに再確認']),N('f-case','skill',['case-library','case-library'],['"Error notebook": agent suggestion vs. owner correction','「間違いノート」：エージェント案とオーナーの修正']),N('f-df','skill',['decision framework / failure patterns','判断フレーム／失敗パターン'],''),N('f-reg','skill',['client-registry rules','client-registry ルール'],['How to identify a client → points to Notion','顧客特定の手順 → Notionを参照']),N('f-cons','skill',['consultation-log rules','consultation-log ルール'],['What counts as a substantive inquiry','「実質的な相談」の基準'])],

  [N('f-led','skill',['review-ledger','review-ledger'],['What was analyzed · what is on hold · what can run now','分析済み・保留中・今実行できる分析']),N('f-met','skill',['metric interpretation','指標の読み方'],['Four-quadrant diagnosis','4象限診断']),N('f-fb','skill',['data access manual','データ取得マニュアル'],'')]
 ]],

/* ---------- RENDER ---------- */
let cur='main';
function render(){
 document.documentElement.lang=L?'ja':'en';
 document.getElementById('title').textContent=T(UI.title);
 document.getElementById('subtitle').textContent=T(UI.subtitle);
 document.getElementById('tabs').innerHTML=UI.tabs.map(t=>`<button class="tab${t[0]==cur?' on':''}" data-v="${t[0]}">${T(t[1])}</button>`).join('');
 let v=`<div class="view${cur=='main'?' on':''}" id="v-main">
  <div class="legend">${UI.legend.map(x=>`<span><i class="sw" style="background:${x[0]}"></i>${T(x[1])}</span>`).join('')}<span><i class="sot">${T(SOTt)}</i></span></div>
  <div class="scroll"><div class="grid"><div class="lanehead"><div></div>${UI.stages.map((s,i)=>`<div class="stagehd s${i+1}">${T(s)}</div>`).join('')}</div>
  ${lanes.map(([lbl,cells])=>`<div class="lane"><div class="lanelbl">${T(lbl)}</div>${cells.map(c=>`<div class="cell">${c.map(f=>f()).join('')}</div>`).join('')}</div>`).join('')}
  </div></div><div class="hint" style="margin-top:10px">${T(UI.loop)}</div></div>`;
 ['s1','s2','s3','s4','s5'].forEach((k,i)=>{
  const flow=F[k];
  v+=`<div class="view${cur==k?' on':''}" id="v-${k}"><h2>${T(UI.stages[i])}</h2><div class="sub">${T(stageText[k][0])}</div><div class="flow">${flow.map(f=>f()).join('')}</div></div>`;
 });
 v+=`<div class="view${cur=='sot'?' on':''}" id="v-sot"><h2>${T(UI.tabs[6][1])}</h2><div class="sub">${T(UI.sotIntro)}</div>
  <table><tr><th style="width:28%">${T(UI.sotHead[0])}</th><th style="width:32%">${T(UI.sotHead[1])}</th><th>${T(UI.sotHead[2])}</th></tr>
  ${SOTROWS.map(r=>`<tr><td class="f">${T(r[0])}</td><td><span class="tag ${r[1]}">${T(r[2])}</span></td><td style="color:var(--muted-foreground)">${T(r[3])}</td></tr>`).join('')}</table>
  <div class="warn" style="margin-top:14px">${T(UI.sotWarn)}</div></div>`;
 document.getElementById('views').innerHTML=v;
 document.getElementById('detail').innerHTML=`<div class="dt">${T(UI.pick)}</div><div class="dd">${T(UI.pickd)}</div>`;
}
render();

document.querySelector('.lang').onclick=e=>{const b=e.target.closest('button');if(!b)return;L=+b.dataset.l;
 document.querySelectorAll('.lang button').forEach(x=>x.classList.toggle('on',x===b));render();};
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;cur=b.dataset.v;render();};
document.body.addEventListener('click',e=>{const el=e.target.closest('[data-id]');if(!el)return;
 document.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');
 const d=D[el.dataset.id];if(!d)return;
 const strip=s=>s.replace(/<i class="sot">.*?<\/i>/g,'').replace(/<[^>]+>/g,'').trim();
 let h=`<div class="dt">${strip(T(d.t))}</div><div class="dd">${T(d.m)}</div>`,boxes='';
 if(d.r)boxes+=`<div class="iobox"><div class="h">${T(UI.rd)}</div><ul>${d.r.map(x=>'<li>'+T(x)+'</li>').join('')}</ul></div>`;
 if(d.w)boxes+=`<div class="iobox"><div class="h">${T(UI.wr)}</div><ul>${d.w.map(x=>'<li>'+T(x)+'</li>').join('')}</ul></div>`;
 if(boxes)h+=`<div class="io">${boxes}</div>`;
 if(d.g)h+=`<div class="warn">🔒 ${T(UI.gate)}: ${T(d.g)}</div>`;
 if(d.n)h+=`<div class="note">💡 ${T(d.n)}</div>`;
 if(!boxes&&!d.g&&!d.n)h+=`<div class="hint">${T(UI.none)}</div>`;
 document.getElementById('detail').innerHTML=h;});
</script>
